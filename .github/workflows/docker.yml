name: docker

on:
  workflow_dispatch: 

jobs:
  test-docker-action:
    name: job to test our docker action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./docker
        id: dockerAction
        with:
          number1: 4
          number2: 2

      - run: echo "${{ steps.dockerAction.outputs.result }}"
      - run: cat "$GITHUB_WORKSPACE/containerOutputFile.txt"
