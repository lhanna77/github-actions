name: actions

on: 
  workflow_dispatch:

jobs:
  test-actions:
    name: test-action
    runs-on: ubuntu-latest
    steps:
      - name: list files
        run: ls
      - name: Checkout
        uses: actions/checkout@v4
      - name: list files after CO
        run: ls
      - name: hello-world-action
        id: hello-world-action
        uses: actions/hello-world-docker-action@main
        with:
          who-to-greet: 'Lee'
      - name: Debug Action Outputs
        run: |
          echo "All step outputs: ${{ toJson(steps.hello-world-action.outputs) }}"
      - name: time
        run: |
          echo "greeting time: ${{ steps.hello-world-action.outputs.time }}"
      - name: docker action
        uses: docker://hello-world:latest
