name: CI

env:
  TEST_VAR: "Lee Hannah"
  GITHUB_CONTEXT_JSON: ${{ toJson(github) }}

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  test_expressions:
    
    runs-on: ubuntu-latest
    
    env:
      aBool: ${{ false }}
      aNull: ${{ null }}
      aNumber: ${{ 21 }}
      aString: this string

    steps:
      - name: test null
        if: (env.aNull == null)
        run: echo "aNull is null"
      - name: test bool
        if: ${{ fromJson(env.aBool) }}
        run: echo "aBool is false, so won't display"
      - name: test contains
        if: ${{ contains(env.aString, 'this') }}
        run: |
          echo "aString contains - this"
          echoS "FAIL"
      - name: test status check and format func
        if: ${{ failure() }}
        env:
          FORMAT_VAR: ${{ format('Github {0} {1} {2}', 'actions', 'is', 'awesome!') }} 
        run: |
          echo "display when failure"
          echo ${{ env.FORMAT_VAR }}
      - name: test always status check
        if: ${{ contains(env.aString, 'this') && always() }}
        run: sleep 60
      - name: test cancel status
        if: ${{ cancelled() }}
        run: echo "CANCELLED"

  # This workflow contains a single job called "build"
  test_vars:

    if: (github.event_name == 'pull_request')  
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Print vars
        run: |
          echo Hello, world from ${{ github.actor }}
          echo $TEST_VAR
          echo $GITHUB_JOB
          echo ${{ vars.CONF_VAR }}
          echo ${{ secrets.A_SECRET }}

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo github context...
          echo $GITHUB_CONTEXT_JSON
